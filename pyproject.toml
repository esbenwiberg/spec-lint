[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "speclint"
version = "0.5.0"
description = "A semantic linter for spec folders. ESLint-shaped, format-agnostic, LLM-optional."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Esben Wiberg" }]
dependencies = [
    "click>=8.1",
    "markdown-it-py>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.50.0"]
semantic = ["fastembed>=0.4"]
all = ["speclint[anthropic,openai,semantic]"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
speclint = "speclint.cli:main"

[project.entry-points."speclint.rules"]
default = "speclint.rules.builtin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/speclint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
