[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "speclint-test-plugin"
version = "0.0.1"
description = "In-tree test plugin for spec-lint override semantics"
requires-python = ">=3.11"
dependencies = ["speclint"]

[project.entry-points."speclint.rules"]
testplugin = "speclint_test_plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["src/speclint_test_plugin"]
